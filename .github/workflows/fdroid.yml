# Builds a signed release APK and publishes it as an F-Droid repository on
# GitHub Pages. Subscribe in the F-Droid client with:
#   https://<owner>.github.io/share-router-android/repo
#
# Required repository secrets (set once, see README "F-Droid repo"):
#   SIGNING_KEYSTORE_B64    base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD  keystore password
#   SIGNING_KEY_ALIAS       key alias
#   SIGNING_KEY_PASSWORD    key password
name: fdroid-repo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes the gh-pages branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdroidserver imagemagick

      - name: Assemble F-Droid repo
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          mkdir -p fdroid/repo
          cp app/build/outputs/apk/release/app-release.apk \
             "fdroid/repo/sharerouter_${{ github.run_number }}.apk"

          # Repo icon (F-Droid index wants one); plain brand-blue square.
          mkdir -p fdroid/repo/icons
          convert -size 512x512 xc:'#1F6FEB' fdroid/icon.png
          cp fdroid/icon.png fdroid/repo/icons/icon.png

          OWNER_REPO="${{ github.repository }}"
          OWNER="${OWNER_REPO%%/*}"
          NAME="${OWNER_REPO##*/}"
          cat > fdroid/config.yml <<EOF
          repo_url: https://${OWNER}.github.io/${NAME}/repo
          repo_name: Share Router (lorenzl5)
          repo_icon: icon.png
          repo_description: >-
            Personal F-Droid repo serving the Share Router app — an Android
            share target that routes shared content to MasterAPI endpoints.
          archive_older: 0
          keystore: $RUNNER_TEMP/release.jks
          repo_keyalias: $SIGNING_KEY_ALIAS
          keystorepass: $SIGNING_STORE_PASSWORD
          keypass: $SIGNING_KEY_PASSWORD
          keydname: CN=lorenzl5 Share Router
          EOF

          cd fdroid
          fdroid update --create-metadata --pretty

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid
          publish_branch: gh-pages
          force_orphan: true
